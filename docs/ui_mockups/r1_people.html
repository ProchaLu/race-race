<title>R1 People Mockups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: chrome (screen tabs + range-style switch) on top, then one fixed dark
   Pit Wall stage per screen: staff profile, negotiation, transfer market. */
:root {
  --chrome-bg: #f3f4f6; --chrome-fg: #1b2230; --chrome-muted: #5d6676; --chrome-line: #d6dae1;
  --chrome-btn: #ffffff; --chrome-active: #1b2230; --chrome-active-fg: #ffffff;
  --bg: #0e1216; --panel: #141a20; --panel-2: #10151a; --text: #dfe5ea; --muted: #7f8b96; --faint: #56616c;
  --line: #232c35; --line-strong: #34404b; --zebra: #171e25; --hover: #1d2731; --amber: #f2a93b;
  --lv1: #ef5b5b; --lv2: #e0a13a; --lv3: #8fc46a; --lv4: #4fd1a5; --team: #e8471c;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --chrome-bg: #0a0c0f; --chrome-fg: #e6e9ee; --chrome-muted: #8f98a8; --chrome-line: #262c36;
    --chrome-btn: #151920; --chrome-active: #f2a93b; --chrome-active-fg: #101318; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --chrome-bg: #0a0c0f; --chrome-fg: #e6e9ee; --chrome-muted: #8f98a8; --chrome-line: #262c36;
  --chrome-btn: #151920; --chrome-active: #f2a93b; --chrome-active-fg: #101318; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--chrome-bg); color: var(--chrome-fg); font-family: var(--f-body); font-size: 14px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 40px;
}
.lab { max-width: 1480px; margin: 0 auto; display: grid; gap: 12px; }
.lab-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.lab-head h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
.lab-head p { margin: 4px 0 0; color: var(--chrome-muted); font-size: .875rem; max-width: 72ch; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.controls .label { color: var(--chrome-muted); font-size: .8125rem; margin-left: 10px; }
.controls button {
  font: inherit; font-size: .875rem; padding: 8px 14px; border-radius: 4px; cursor: pointer;
  border: 1px solid var(--chrome-line); background: var(--chrome-btn); color: var(--chrome-fg);
}
.controls button[aria-pressed="true"] { background: var(--chrome-active); color: var(--chrome-active-fg); border-color: var(--chrome-active); }
.controls button:focus-visible { outline: 2px solid var(--team); outline-offset: 2px; }
.note { margin: 0; font-size: .875rem; color: var(--chrome-muted); max-width: 110ch; }
.note b { color: var(--chrome-fg); }

/* ---------- Pit Wall stage ---------- */
.stage { background: var(--bg); color: var(--text); padding: 16px; border-radius: 2px; display: grid; gap: 14px; overflow-x: auto; }
.row { display: grid; gap: 14px; min-width: 0; }
.stack { display: grid; gap: 14px; align-content: start; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding-bottom: 10px; min-width: 0; display: flex; flex-direction: column; }
.card > h3 {
  margin: 0 0 4px; padding: 8px 16px 7px; border-bottom: 1px solid var(--line); font-family: var(--f-display);
  font-weight: 700; font-size: .9rem; letter-spacing: .12em; text-transform: uppercase; color: var(--amber);
  display: flex; justify-content: space-between; align-items: baseline; gap: 10px;
}
.card > h3 small { font-family: var(--f-body); font-weight: 400; font-size: .75rem; letter-spacing: 0; text-transform: none; color: var(--muted); }
.sub { margin: 10px 16px 2px; font-family: var(--f-display); font-size: .75rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.good { color: var(--lv4); } .ok { color: var(--lv3); } .warn { color: var(--lv2); } .bad { color: var(--lv1); } .amber { color: var(--amber); }
.pad { padding: 4px 16px; }

.attr, .fact, .info { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 12px; padding: 4px 16px; }
.attr:nth-child(even of .attr), .fact:nth-child(even of .fact), .info:nth-child(even of .info) { background: var(--zebra); }
.attr:hover, .fact:hover, .info:hover { background: var(--hover); }
.val { font-family: var(--f-mono); font-weight: 600; font-size: .9rem; min-width: 2.8em; text-align: center; padding: 0 4px; border: 1px solid var(--line-strong); background: var(--panel-2); }
.v1 { color: var(--lv1); } .v2 { color: var(--lv2); } .v3 { color: var(--lv3); } .v4 { color: var(--lv4); }
.fact .k, .info small { color: var(--muted); }
.fact .v { font-weight: 600; text-align: right; font-variant-numeric: tabular-nums; }
.fact .v small { display: block; font-weight: 400; color: var(--muted); font-size: .75rem; }
.info small { font-size: .75rem; margin-left: 8px; }

/* Identity */
.ident { display: grid; grid-template-columns: auto 1fr; gap: 18px; align-items: center; padding: 8px 14px; border-left: 5px solid var(--team); }
.ident .pic { width: 90px; border: 1px solid var(--line-strong); }
.ident .pic svg { display: block; width: 100%; height: auto; }
.ident .role { font-family: var(--f-display); font-weight: 600; color: var(--amber); text-transform: uppercase; letter-spacing: .1em; font-size: .95rem; }
.ident .name { font-family: var(--f-display); font-size: 2.5rem; font-weight: 700; line-height: 1; text-transform: uppercase; }
.ident .name span { color: var(--muted); font-weight: 600; font-size: 1.1rem; letter-spacing: .08em; margin-right: 10px; }
.ident .meta { display: flex; flex-wrap: wrap; gap: 4px 24px; color: var(--muted); font-size: .8125rem; margin-top: 6px; }
.ident .meta b { color: var(--text); font-weight: 600; }

.tiles { display: grid; grid-template-columns: repeat(5, 1fr); }
.tile { padding: 10px 16px; border-right: 1px solid var(--line); display: grid; gap: 5px; }
.tile:last-child { border-right: none; }
.tile .k { font-family: var(--f-display); font-size: .75rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.tile .v { font-size: 1.15rem; font-weight: 600; }
.meter { height: 4px; background: var(--line); position: relative; }
.meter > i { position: absolute; inset: 0 auto 0 0; }

.stars { color: var(--amber); letter-spacing: 2px; white-space: nowrap; }
.stars .off { color: var(--line-strong); }

.trait { display: grid; grid-template-columns: 2rem 1fr; gap: 12px; align-items: center; padding: 5px 8px; margin: 0 16px 6px; border: 1px solid var(--line); background: var(--panel-2); }
.trait .ico { width: 2rem; height: 2rem; display: grid; place-items: center; border: 1px solid; font-size: .95rem; }
.trait.pos .ico { border-color: color-mix(in srgb, var(--lv4) 55%, transparent); background: color-mix(in srgb, var(--lv4) 12%, transparent); color: var(--lv4); }
.trait.neg .ico { border-color: color-mix(in srgb, var(--lv1) 55%, transparent); background: color-mix(in srgb, var(--lv1) 12%, transparent); color: var(--lv1); }
.trait b { display: block; font-weight: 600; }
.trait.pos b { color: var(--lv4); } .trait.neg b { color: var(--lv1); }
.trait small { color: var(--muted); font-size: .8rem; }

.impact { display: grid; grid-template-columns: 1fr auto; gap: 4px 12px; padding: 6px 16px; align-items: baseline; }
.impact:nth-child(even of .impact) { background: var(--zebra); }
.impact b { font-family: var(--f-mono); font-weight: 600; }
.impact small { grid-column: 1 / -1; color: var(--muted); font-size: .75rem; }
.timeline { display: grid; gap: 0; padding: 4px 16px; }
.timeline div { display: grid; grid-template-columns: 6.5em 1fr; gap: 10px; padding: 4px 0; border-left: 2px solid var(--line-strong); padding-left: 12px; position: relative; }
.timeline div::before { content: ""; position: absolute; left: -5px; top: 10px; width: 8px; height: 8px; background: var(--line-strong); }
.timeline div.now::before { background: var(--amber); }
.timeline span { color: var(--muted); font-family: var(--f-mono); font-size: .8rem; }

/* ---------- Negotiation ---------- */
.neg { grid-template-columns: 300px 1fr 360px; align-items: start; }
.field { padding: 8px 16px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); }
.field:last-child { border-bottom: none; }
.field .top { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.field .top label { color: var(--muted); }
.field .top b { font-family: var(--f-mono); font-size: 1rem; }
.field .hint { color: var(--muted); font-size: .75rem; }
.field .hint .amber { font-weight: 600; }
input[type=range] { width: 100%; accent-color: var(--amber); }
.seg { display: flex; gap: 0; }
.seg button { flex: 1; font: inherit; padding: 6px 4px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line-strong); cursor: pointer; }
.seg button + button { border-left: none; }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--amber) 16%, var(--panel-2)); color: var(--amber); border-color: var(--amber); }
.seg button:focus-visible, .btn:focus-visible, .check input:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.check { display: flex; align-items: center; gap: 8px; padding: 3px 0; cursor: pointer; }
.check input { accent-color: var(--amber); width: 16px; height: 16px; }
.btn { font: inherit; padding: 9px 16px; cursor: pointer; border: 1px solid var(--line-strong); background: var(--panel); color: var(--text); }
.btn.primary { background: var(--amber); color: #0e1216; border-color: var(--amber); font-family: var(--f-display); font-weight: 700; font-size: 1.05rem; letter-spacing: .06em; text-transform: uppercase; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.actions { display: flex; gap: 10px; padding: 10px 16px 2px; flex-wrap: wrap; }
.sat { padding: 10px 16px; display: grid; gap: 8px; }
.sat .big { display: flex; align-items: baseline; justify-content: space-between; }
.sat .big b { font-family: var(--f-display); font-size: 2.6rem; line-height: 1; }
.sat .big span { font-family: var(--f-display); font-weight: 600; font-size: 1.1rem; text-transform: uppercase; letter-spacing: .06em; }
.sat .meter { height: 10px; }
.sat .meter .mark { position: absolute; top: -4px; bottom: -4px; width: 2px; background: var(--text); }
.prio { display: grid; grid-template-columns: 1fr auto auto; gap: 10px; align-items: center; padding: 5px 16px; }
.prio:nth-child(even of .prio) { background: var(--zebra); }
.dots { letter-spacing: 2px; color: var(--amber); font-size: .7rem; }
.dots i { color: var(--line-strong); font-style: normal; }
.patience { display: flex; gap: 4px; }
.patience i { width: 18px; height: 6px; background: var(--amber); }
.patience i.used { background: var(--line-strong); }
.log { padding: 6px 16px; display: grid; gap: 8px; max-height: 220px; overflow-y: auto; }
.log p { margin: 0; padding: 8px 10px; background: var(--panel-2); border-left: 3px solid var(--line-strong); font-size: .85rem; }
.log p.agent { border-left-color: var(--amber); }
.log p small { display: block; color: var(--muted); font-size: .72rem; margin-bottom: 2px; text-transform: uppercase; letter-spacing: .08em; }
.cost { padding: 6px 16px; display: grid; gap: 2px; }

/* Conversation-first negotiation */
.neg2 { grid-template-columns: 270px minmax(0, 1fr) 340px; align-items: stretch; }
.chat { display: flex; flex-direction: column; min-height: 640px; }
.thread { flex: 1; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px; overflow-y: auto; max-height: 560px; }
.msg { display: grid; grid-template-columns: 40px minmax(0, 1fr); gap: 10px; max-width: 80%; }
.msg svg { width: 40px; height: 48px; display: block; border: 1px solid var(--line-strong); }
.msg .bubble { background: var(--panel-2); border: 1px solid var(--line); padding: 9px 12px; line-height: 1.45; }
.msg .bubble small { display: block; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; }
.msg.you { align-self: flex-end; grid-template-columns: minmax(0, 1fr); }
.msg.you .bubble { background: color-mix(in srgb, var(--amber) 10%, var(--panel-2)); border-color: color-mix(in srgb, var(--amber) 40%, transparent); }
.msg .mood { display: inline-block; margin-top: 6px; font-size: .75rem; font-family: var(--f-mono); }
.offer-card { border: 1px solid var(--amber); background: var(--panel-2); padding: 8px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 14px; font-size: .85rem; }
.offer-card b { grid-column: 1 / -1; font-family: var(--f-display); text-transform: uppercase; letter-spacing: .1em; color: var(--amber); font-size: .8rem; margin-bottom: 2px; }
.offer-card span:nth-child(odd) { color: var(--muted); }
.system { align-self: center; color: var(--muted); font-size: .8rem; border: 1px dashed var(--line-strong); padding: 6px 12px; }
.composer { border-top: 1px solid var(--line); padding: 12px 16px; display: grid; gap: 10px; background: var(--panel); }
.points { display: flex; flex-wrap: wrap; gap: 8px; }
.point { font: inherit; font-size: .85rem; text-align: left; padding: 8px 12px; cursor: pointer; background: var(--panel-2); color: var(--text); border: 1px solid var(--line-strong); }
.point:hover:not(:disabled) { border-color: var(--amber); }
.point:disabled { opacity: .35; cursor: default; }
.point small { display: block; color: var(--muted); font-size: .72rem; }
.point.risky small { color: var(--lv2); }
.point:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.mini .field { padding: 6px 16px; }
.hidden-prio { color: var(--faint); font-style: italic; }

/* ---------- Market ---------- */
.market { grid-template-columns: 1fr 380px; align-items: start; }
.filters { display: flex; flex-wrap: wrap; gap: 10px; padding: 10px 16px; align-items: center; border-bottom: 1px solid var(--line); }
.filters select, .filters input[type=text] { font: inherit; background: var(--panel-2); color: var(--text); border: 1px solid var(--line-strong); padding: 6px 8px; }
.filters .seg button { padding: 6px 12px; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
th { text-align: left; font-family: var(--f-display); font-weight: 600; font-size: .85rem; letter-spacing: .06em; color: var(--muted); padding: 8px 10px; background: var(--panel-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 6px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tbody tr { cursor: pointer; }
tbody tr:hover { background: color-mix(in srgb, var(--amber) 8%, transparent); outline: 1px solid color-mix(in srgb, var(--amber) 45%, transparent); }
tbody tr.sel { background: color-mix(in srgb, var(--amber) 16%, transparent); outline: 1px solid var(--amber); }
td .who { display: flex; align-items: center; gap: 10px; }
td .who svg { width: 26px; height: 31px; display: block; }
.star-btn { background: none; border: none; color: var(--line-strong); font-size: 1.1rem; cursor: pointer; padding: 0 4px; }
.star-btn.on { color: var(--amber); }
.status { font-size: .78rem; padding: 2px 7px; border: 1px solid; white-space: nowrap; }
.status.free { color: var(--lv4); border-color: color-mix(in srgb, var(--lv4) 50%, transparent); }
.status.clause { color: var(--amber); border-color: color-mix(in srgb, var(--amber) 50%, transparent); }
.status.contract { color: var(--muted); border-color: var(--line-strong); }
.know { display: flex; align-items: center; gap: 6px; }
.know .meter { width: 56px; height: 4px; }
.know span { color: var(--muted); font-size: .75rem; font-family: var(--f-mono); }

/* ---------- Range display variants ---------- */
.rng { display: inline-flex; align-items: center; gap: 6px; font-family: var(--f-mono); font-weight: 600; }
.rng-bar { position: relative; width: 74px; height: 8px; background: var(--line); }
.rng-bar i { position: absolute; top: 0; bottom: 0; }
.rng-bar b { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--text); }
.ghost-star { color: transparent; -webkit-text-stroke: 1px var(--amber); }
.qmark { font-family: var(--f-display); font-weight: 700; color: #0e1216; background: var(--amber); font-size: .7rem; padding: 0 4px; margin-left: 4px; }
.val.range { min-width: 4.2em; }

.preview .head { display: grid; grid-template-columns: 74px 1fr; gap: 12px; padding: 10px 16px; align-items: center; }
.preview .head svg { width: 74px; height: auto; display: block; border: 1px solid var(--line-strong); }
.preview .head b { font-family: var(--f-display); font-size: 1.5rem; text-transform: uppercase; display: block; line-height: 1.05; }
.preview .head span { color: var(--muted); font-size: .8rem; }
.explain { padding: 8px 16px; color: var(--muted); font-size: .8rem; }

[hidden] { display: none !important; }
@media (max-width: 1100px) {
  .neg, .market { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: repeat(3, 1fr); }
}
@media (max-width: 700px) {
  .stage .row { grid-template-columns: 1fr !important; }
  .tiles { grid-template-columns: 1fr 1fr; }
}
</style>

<div class="lab">
  <div class="lab-head">
    <div>
      <h1>R1 mockups: staff, negotiation, transfer market</h1>
      <p>Pit Wall style, sample data. Values on the negotiation screen react live. In the market, click a row to see the person on the right and the star to add them to your shortlist.</p>
    </div>
    <div class="controls" role="group" aria-label="Screen">
      <button data-screen="staff" aria-pressed="true">1 · Staff profile</button>
      <button data-screen="nego" aria-pressed="false">2 · Negotiation</button>
      <button data-screen="market" aria-pressed="false">3 · Transfer market</button>
    </div>
  </div>
  <div class="controls" role="group" aria-label="Uncertain values">
    <span class="label">Uncertain values (market):</span>
    <button data-range="a" aria-pressed="false">A · Range text</button>
    <button data-range="b" aria-pressed="true">B · Range bar (chosen)</button>
    <button data-range="c" aria-pressed="false">C · Estimate + ?</button>
  </div>
  <p class="note" id="note"></p>
  <section class="stage" id="stage" aria-live="polite"></section>
</div>

<script>
// ===== Flat portrait generator (same rules as the game's PortraitGenerator) =====
function hash(s) { let h = 2166136261; for (const c of s) { h ^= c.charCodeAt(0); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const pick = (r, l) => l[Math.floor(r() * l.length)];
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function mix(c1, c2, t) { const p = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16)); const a = p(c1), b = p(c2); return "#" + a.map((v, i) => Math.round(v + (b[i] - v) * t).toString(16).padStart(2, "0")).join(""); }
const darken = (c, t) => mix(c, "#000000", t);
const HER = { SE: "nordic", NO: "nordic", FI: "nordic", GB: "west", DE: "west", NL: "west", FR: "west", US: "west", IT: "med", ES: "med", BR: "latam", AR: "latam", MX: "latam", JP: "east_asian", IN: "south_asian", NG: "african", BE: "west", AU: "west" };
const SKIN = { nordic: ["#f6d7c6", "#f0cab4"], west: ["#f1c9ae", "#e8b896", "#dfa888"], med: ["#e3b08c", "#d9a47e"], latam: ["#c98d63", "#d39b72"], african: ["#8d5a3b", "#6f432a"], south_asian: ["#b07a52", "#a06b45"], east_asian: ["#f0c9a4", "#e8bd96"] };
const HAIR = { nordic: ["#d8b26a", "#b48a55", "#7a5535"], west: ["#5a3d28", "#2e2119", "#c9a15e", "#8a6440"], med: ["#2a1d16", "#1b1512"], latam: ["#1b1512", "#2e2119"], african: ["#161110"], south_asian: ["#141110"], east_asian: ["#141214", "#231b17"] };
function portrait(p, team) {
  const r = rng(hash(p.id + ":face"));
  const h = HER[p.nat] || "west", f = p.gender === "f";
  const skin = pick(r, SKIN[h]), hairBase = pick(r, HAIR[h]);
  const w = (f ? 18.6 : 20.2) + r() * 2.5, jw = w - 4 - r() * 2, cx = 50;
  const grey = clamp((p.age - (32 + r() * 18)) / 22, 0, .9), hair = mix(hairBase, "#bdbdbd", grey);
  const recede = (!f && r() < .5) ? clamp((p.age - (28 + r() * 22)) / 26, 0, 1) : 0;
  const style = f ? pick(r, ["long", "bob", "bun", "ponytail"]) : pick(r, ["short", "side", "buzz", "quiff", "short"]);
  const beard = f || p.age < 18 ? "none" : pick(r, ["none", "none", "none", "stubble", "full", "moustache"]);
  const glasses = r() < (p.age > 45 ? .45 : .1), earring = f && r() < .5;
  const o = [];
  o.push(`<rect width="100" height="120" fill="${mix("#141a20", team, .16)}"/><circle cx="50" cy="58" r="44" fill="${mix("#141a20", team, .28)}"/>`);

const AGENT = { id: "a_klein", name: "Sarah Klein", nat: "DE", age: 47, gender: "f" };
// Conversation-first negotiation: the chat in the middle is the main stage.
// Satisfaction = how good the offer is + the mood built in the conversation.
const offer = { salary: 2.4, years: 2, role: "No.2 driver", win: 120, signing: 0, clause: true, promise: false };
const DEMAND = { salary: 3.4, years: 3, role: "Equal status", win: 200 };
const nego = { rapport: 0, patience: 4, prioritiesKnown: false, used: new Set(), done: false, lastSat: null };
let thread = [
  { who: "system", text: "Talks started · Monday 27 July 2026" },
  { who: "agent", text: "Thanks for making time. I'll be honest: Jonas is frustrated. He's been the No.2 for two years and he feels he's earned more. Two other teams have called me this month." }
];
const POINTS = [
  { id: "ask", label: "\"What matters most to Jonas?\"", hint: "Reveals the agent's priorities", risky: false },
  { id: "future", label: "\"Jonas is a key part of our future.\"", hint: "Builds trust, stronger with a better role", risky: false },
  { id: "car", label: "\"Our new floor arrives in round 16.\"", hint: "Eases worries about the car", risky: false },
  { id: "others", label: "\"Other teams can't offer him a seat like this.\"", hint: "Risky with a proud agent", risky: true },
  { id: "final", label: "\"This is our final offer.\"", hint: "Only works if you are already close", risky: true },
];
function offerScore() {
  const s = clamp(1 - (DEMAND.salary - offer.salary) / 2, 0, 1.1);
  const role = { "No.1 driver": 1.1, "Equal status": 1, "No.2 driver": 0.35 }[offer.role];
  const yrs = 1 - Math.abs(DEMAND.years - offer.years) * 0.2;
  const bonus = clamp(offer.win / DEMAND.win, 0, 1.1);
  const extras = (offer.signing / 1000) * 0.08 + (offer.clause ? 0 : 0.06) + (offer.promise ? 0.08 : 0);
  return (s * 0.45 + role * 0.3 + yrs * 0.12 + bonus * 0.08 + extras) * 100;
}
const satisfaction = () => Math.round(clamp(offerScore() + nego.rapport, 0, 100));
function prioState(ok) { return ok >= 0.95 ? '<span class="good">Happy</span>' : ok >= 0.7 ? '<span class="warn">Close</span>' : '<span class="bad">Far apart</span>'; }
function moodTag(delta) { return delta === 0 ? "" : `<span class="mood ${delta > 0 ? "good" : "bad"}">Mood ${delta > 0 ? "+" : ""}${delta}</span>`; }

function useTalkingPoint(id) {
  const p = POINTS.find(x => x.id === id);
  nego.used.add(id);
  thread.push({ who: "you", text: p.label.replace(/"/g, "") });
  let reply, delta = 0;
  if (id === "ask") {
    nego.prioritiesKnown = true; delta = 2;
    reply = "Status first. He wants to be treated as an equal to Hale. Then the money, of course. And he'd like three years of security.";
  } else if (id === "future") {
    delta = offer.role === "No.2 driver" ? 1 : 6;
    reply = offer.role === "No.2 driver" ? "Nice words. But your offer still calls him the No.2. Show it in the contract." : "That's what he needed to hear. He wants to build something here.";
  } else if (id === "car") {
    delta = 4; reply = "That helps. He was worried you'd fall back into the midfield. Keep me updated on that floor.";
  } else if (id === "others") {
    delta = -7; nego.patience = Math.max(0, nego.patience - 1);
    reply = "Really? Because I have two offers on my desk that say otherwise. Let's not play games.";
  } else if (id === "final") {
    if (satisfaction() >= 75) { delta = 10; reply = "Alright. You drive a hard bargain, but we can live with that. Send it over."; }
    else { delta = -9; nego.patience = Math.max(0, nego.patience - 1); reply = "Then I think we are done here. That offer doesn't come close."; }
  }
  nego.rapport += delta;
  thread.push({ who: "agent", text: reply, delta });
  render();
}
function sendOffer() {
  const sat = satisfaction();
  nego.patience = Math.max(0, nego.patience - 1);
  thread.push({ who: "offer" });
  let reply;
  if (sat >= 85) { reply = "We have a deal. Jonas will sign the papers within the next three days. Until then, keep the other teams away from him."; nego.done = true; thread.push({ who: "agent", text: reply }); thread.push({ who: "system", text: "Agreement reached · signature expected on Thursday 30 July" }); render(); return; }
  if (sat >= 65) reply = `We're getting closer. Move on ${offer.role === "No.2 driver" ? "his role" : offer.salary < DEMAND.salary ? "the salary" : "the length"} and we have something.`;
  else if (sat >= 40) reply = "That's still far from what Jonas is worth. I need to see real movement.";
  else reply = "Is this a joke? I'll pretend I didn't see that.";
  if (nego.patience === 0) reply += " And I'm running out of patience.";
  thread.push({ who: "agent", text: reply });
  render();
}

function bindNego() {

    const k = el.dataset.k;
    const handler = () => {
      if (el.type === "range") offer[k] = parseFloat(el.value);
      else if (el.type === "checkbox") offer[k] = el.checked;
      else offer[k] = isNaN(el.dataset.v) ? el.dataset.v : parseInt(el.dataset.v);
      const focusId = el.id;
      render();
      if (focusId) document.getElementById(focusId)?.focus();
    };
    el.addEventListener(el.type === "range" ? "input" : el.type === "checkbox" ? "change" : "click", handler);
  });
  document.querySelectorAll("#stage [data-point]").forEach(b => b.addEventListener("click", () => useTalkingPoint(b.dataset.point)));
  document.getElementById("send-offer")?.addEventListener("click", sendOffer);
  document.getElementById("walk")?.addEventListener("click", () => {
    thread.push({ who: "you", text: "Let's leave it here for now." });
    thread.push({ who: "agent", text: "Your call. Don't be surprised if Jonas listens to the other teams now." });
    nego.done = true; render();
  });
}

function starRange(lo, hi) {
  if (lo === hi) return stars(lo);
  const mid = (lo + hi) / 2;
  if (rangeStyle === "a") return `${stars(lo)}<span style="color:var(--muted);margin:0 4px">–</span>${stars(hi)}`;
  if (rangeStyle === "b") {
    let s = "";
    for (let i = 1; i <= 5; i++) s += i <= lo ? "★" : i <= Math.ceil(hi) ? '<span class="ghost-star">★</span>' : '<span class="off">★</span>';
    return `<span class="stars">${s}</span>`;
  }
  return `${stars(Math.round(mid * 2) / 2)}<span class="qmark">?</span>`;
}
function attrRange(v, lo, hi) {
  if (lo === hi) return `<span class="val ${lv(v)}">${v}</span>`;
  const mid = Math.round((lo + hi) / 2);
  if (rangeStyle === "a") return `<span class="val range" style="color:${lvColor(mid)};opacity:.9">${lo}–${hi}</span>`;
  if (rangeStyle === "b") return `<span class="rng"><span class="rng-bar"><i style="left:${(lo - 1) / 19 * 100}%;width:${(hi - lo) / 19 * 100}%;background:${lvColor(mid)};opacity:.75"></i></span><span style="color:var(--muted);font-size:.75rem">${lo}–${hi}</span></span>`;
  return `<span class="val" style="color:${lvColor(mid)}">${mid}<span class="qmark">?</span></span><span style="color:var(--muted);font-size:.72rem;margin-left:4px">±${Math.ceil((hi - lo) / 2)}</span>`;
}

function bindMarket() {

  }));
  document.querySelectorAll("#stage [data-star]").forEach(b => b.addEventListener("click", () => {
    const i = parseInt(b.dataset.star); shortlist.has(i) ? shortlist.delete(i) : shortlist.add(i); render();
  }));
}

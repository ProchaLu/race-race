<title>Driver Talk Mockups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: chrome (driver tabs) on top, then the dark Pit Wall stage:
   briefing strip, then driver card | conversation | effects. */
:root {
  --chrome-bg: #f3f4f6; --chrome-fg: #1b2230; --chrome-muted: #5d6676; --chrome-line: #d6dae1;
  --chrome-btn: #ffffff; --chrome-active: #1b2230; --chrome-active-fg: #ffffff;
  --bg: #0e1216; --panel: #141a20; --panel-2: #10151a; --text: #dfe5ea; --muted: #7f8b96;
  --line: #232c35; --line-strong: #34404b; --zebra: #171e25; --amber: #f2a93b; --team: #e8471c;
  --lv1: #ef5b5b; --lv2: #e0a13a; --lv3: #8fc46a; --lv4: #4fd1a5;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --chrome-bg: #0a0c0f; --chrome-fg: #e6e9ee; --chrome-muted: #8f98a8; --chrome-line: #262c36; --chrome-btn: #151920; --chrome-active: #f2a93b; --chrome-active-fg: #101318; color-scheme: dark; }
}
:root[data-theme="dark"] { --chrome-bg: #0a0c0f; --chrome-fg: #e6e9ee; --chrome-muted: #8f98a8; --chrome-line: #262c36; --chrome-btn: #151920; --chrome-active: #f2a93b; --chrome-active-fg: #101318; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--chrome-bg); color: var(--chrome-fg); font-family: var(--f-body); font-size: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
.lab { max-width: 1500px; margin: 0 auto; display: grid; gap: 12px; }
.lab-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.lab-head h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
.lab-head p { margin: 4px 0 0; color: var(--chrome-muted); font-size: .875rem; max-width: 80ch; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; }
.controls button { font: inherit; font-size: .875rem; padding: 8px 14px; border-radius: 4px; cursor: pointer; border: 1px solid var(--chrome-line); background: var(--chrome-btn); color: var(--chrome-fg); }
.controls button[aria-pressed="true"] { background: var(--chrome-active); color: var(--chrome-active-fg); border-color: var(--chrome-active); }
.note { margin: 0; font-size: .875rem; color: var(--chrome-muted); max-width: 120ch; }
.note b { color: var(--chrome-fg); }

.stage { background: var(--bg); color: var(--text); padding: 16px; border-radius: 2px; display: grid; gap: 14px; overflow-x: auto; }
.row { display: grid; gap: 14px; min-width: 0; align-items: start; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding-bottom: 10px; min-width: 0; }
.card > h3 { margin: 0 0 4px; padding: 8px 16px 7px; border-bottom: 1px solid var(--line); font-family: var(--f-display); font-weight: 700; font-size: .9rem; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card > h3 small { font-family: var(--f-body); font-weight: 400; font-size: .75rem; letter-spacing: 0; text-transform: none; color: var(--muted); }
.card.request { border-color: color-mix(in srgb, var(--lv2) 55%, var(--line)); }
.pad { padding: 6px 16px; }
.muted { color: var(--muted); }
.good { color: var(--lv4); } .ok { color: var(--lv3); } .warn { color: var(--lv2); } .bad { color: var(--lv1); } .amber { color: var(--amber); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.fact { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 5px 16px; align-items: baseline; }
.fact:nth-child(even of .fact) { background: var(--zebra); }
.fact .k { color: var(--muted); }
.fact .v { font-weight: 600; text-align: right; }
.btn { font: inherit; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line-strong); background: var(--panel); color: var(--text); }
.btn.small { padding: 5px 10px; font-size: .8rem; }
.btn.primary { background: var(--amber); color: #0e1216; border-color: var(--amber); font-family: var(--f-display); font-weight: 700; font-size: 1.1rem; letter-spacing: .06em; text-transform: uppercase; padding: 9px 22px; }
.btn.delegate-btn { border-color: color-mix(in srgb, var(--lv4) 50%, transparent); color: var(--lv4); }
.btn:focus-visible, .answer:focus-visible, .seg button:focus-visible, .tabs button:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; align-items: center; padding: 8px 16px 0; }

/* Tabs per driver */
.tabs { display: flex; gap: 0; padding: 0 16px; }
.tabs button { font: inherit; font-family: var(--f-display); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; font-size: 1rem; padding: 10px 18px; background: none; border: none; border-bottom: 3px solid transparent; color: var(--muted); cursor: pointer; display: grid; justify-items: start; gap: 1px; }
.tabs button[aria-pressed="true"] { color: var(--text); border-bottom-color: var(--team); }
.tabs button span { font-family: var(--f-body); font-weight: 500; text-transform: none; letter-spacing: 0; font-size: .75rem; }

/* Briefing strip */
.brief { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.brief-item { display: grid; gap: 8px; padding: 10px 16px; align-content: start; }
.brief-item + .brief-item { border-left: 1px solid var(--line); }
.brief-top { display: grid; grid-template-columns: 70px 1fr; gap: 10px; align-items: center; }
.brief-fx { display: flex; flex-wrap: wrap; gap: 4px; padding-left: 80px; }
.brief-why { font-size: .8rem; padding-left: 80px; line-height: 1.4; }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.seg button { font: inherit; font-size: .8rem; padding: 6px 4px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line-strong); cursor: pointer; }
.seg button + button { border-left: none; }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--amber) 15%, var(--panel-2)); color: var(--amber); border-color: var(--amber); }

/* Driver card */
.who { display: grid; grid-template-columns: 64px 1fr; gap: 12px; padding: 12px 16px; align-items: center; }
.face { width: 64px; height: 64px; background: #2a3440; display: grid; place-items: center; font-family: var(--f-display); font-size: 1.6rem; font-weight: 700; color: var(--muted); border-bottom: 3px solid var(--team); }
.who b { font-family: var(--f-display); font-size: 1.5rem; text-transform: uppercase; display: block; line-height: 1.05; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; padding: 4px 16px 8px; }
.chip { font-size: .75rem; padding: 2px 8px; border: 1px solid var(--line-strong); color: var(--muted); }
.chip.bad { border-color: color-mix(in srgb, var(--lv1) 50%, transparent); color: var(--lv1); }
.chip.warn { border-color: color-mix(in srgb, var(--lv2) 50%, transparent); color: var(--lv2); }
.chip.good { border-color: color-mix(in srgb, var(--lv4) 50%, transparent); color: var(--lv4); }
.know { display: grid; grid-template-columns: 22px 1fr; gap: 6px; padding: 4px 16px; font-size: .82rem; }
.know span:first-child { text-align: center; }
.small-head { padding: 10px 16px 2px; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; }
.history { display: grid; grid-template-columns: 70px 1fr; gap: 6px; padding: 3px 16px; font-size: .8rem; }
.history span:first-child { color: var(--muted); font-family: var(--f-mono); font-size: .75rem; }

/* Conversation */
.stakes { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 10px 16px 0; padding: 10px 12px; border: 1px solid color-mix(in srgb, var(--lv2) 50%, transparent); background: color-mix(in srgb, var(--lv2) 7%, var(--panel-2)); font-size: .82rem; }
.stakes b { font-family: var(--f-display); letter-spacing: .1em; text-transform: uppercase; color: var(--lv2); }
.talkmood { margin: 10px 16px 0; display: grid; grid-template-columns: 110px 1fr 120px; gap: 10px; align-items: center; font-size: .8rem; }
.talkmood .bar { height: 10px; position: relative; background: linear-gradient(90deg, var(--lv1) 0 25%, var(--lv2) 25% 50%, var(--lv3) 50% 75%, var(--lv4) 75% 100%); opacity: .85; }
.talkmood .bar i { position: absolute; top: -4px; bottom: -4px; width: 4px; background: var(--text); transition: left .35s; box-shadow: 0 0 0 2px var(--bg); }
.talkmood .spark { display: block; height: 26px; }
.thread { display: grid; gap: 10px; padding: 12px 16px; align-content: start; }
.bubble { max-width: 78%; padding: 10px 14px; line-height: 1.45; }
.bubble small { display: block; font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin-bottom: 3px; }
.bubble.driver { background: var(--panel-2); border-left: 3px solid var(--team); justify-self: start; }
.bubble.me { background: color-mix(in srgb, var(--amber) 10%, var(--panel-2)); border-right: 3px solid var(--amber); justify-self: end; text-align: right; }
.bubble .fx { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.fxchip { font-family: var(--f-mono); font-size: .72rem; padding: 2px 6px; border: 1px solid; }
.fxchip.pos { color: var(--lv4); border-color: color-mix(in srgb, var(--lv4) 45%, transparent); }
.fxchip.neg { color: var(--lv1); border-color: color-mix(in srgb, var(--lv1) 45%, transparent); }
.fxchip.neu { color: var(--muted); border-color: var(--line-strong); }
.mood-line { font-size: .78rem; color: var(--muted); font-style: italic; justify-self: start; }
.mood-line b { font-style: normal; }
.answers { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 6px 16px 4px; }
.answers.three { grid-template-columns: repeat(3, 1fr); }
.answer { text-align: left; font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line-strong); padding: 10px 12px; cursor: pointer; display: grid; gap: 5px; align-content: start; }
.answer:hover { border-color: var(--amber); }
.answer .tone { font-family: var(--f-display); font-weight: 700; font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; color: var(--amber); display: flex; justify-content: space-between; gap: 8px; }
.answer .tone em { font-style: normal; font-family: var(--f-body); font-weight: 500; letter-spacing: 0; text-transform: none; font-size: .72rem; }
.answer .say { font-size: .84rem; line-height: 1.4; }
.answer .pred { display: flex; flex-wrap: wrap; gap: 4px; }
.round-label { font-family: var(--f-display); font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); font-size: .75rem; padding: 6px 16px 0; }

/* Effects */
.fx-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; padding: 5px 16px; font-size: .84rem; align-items: baseline; }
.fx-row:nth-child(even of .fx-row) { background: var(--zebra); }
.scope { font-family: var(--f-display); font-size: .68rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; padding: 1px 5px; border: 1px solid var(--line-strong); color: var(--muted); margin-left: 6px; }
.empty { padding: 10px 16px; color: var(--muted); font-size: .84rem; }

@media (max-width: 1100px) { .stage .row { grid-template-columns: 1fr !important; } .answers, .answers.three { grid-template-columns: 1fr; } .brief { grid-template-columns: 1fr; } .brief-item + .brief-item { border-left: none; } .brief-fx, .brief-why { padding-left: 0; } }
</style>

<div class="lab">
  <div class="lab-head">
    <div>
      <h1>R2 mockup: 1-on-1 before every race</h1>
      <p>Click the answers. Hale gets the normal weekly 1-on-1. Brandt asked for a talk himself – more is at stake. Sample data, fictional people.</p>
    </div>
    <div class="controls" role="group" aria-label="Driver">
      <button data-d="hale" aria-pressed="false">Marco Hale · weekly 1-on-1</button>
      <button data-d="brandt" aria-pressed="true">Jonas Brandt · asked to talk</button>
    </div>
  </div>
  <p class="note" id="note"></p>
  <section class="stage" id="stage"></section>
</div>

<script>
// ---------- Talk data ----------
// Effect: [label, value, tone, scope]; tone pos/neg/neu; scope race/lasting.
// mood: how the answer moves the talk mood (-100..100) – only in requested talks.
const TALKS = {
  hale: {
    name: "Marco Hale", initials: "MH", role: "28 · No. 1 driver · Race engineer Ito", kind: "weekly",
    chips: [["Qualified P5", "good"], ["Favourite track", "good"], ["Leads Brandt 9–4 in quali", ""]],
    facts: [["Morale", "74 · High", "good"], ["Confidence", "68", "ok"], ["Relationship with you", "Very good", "good"], ["Temperament", "Calm", ""]],
    know: [["✓", "good", "Thrives on ambition talk"], ["✓", "good", "Ignores pressure – no effect"], ["?", "warn", "Promises – not seen yet"]],
    history: [["Rd 13", "Weekly 1-on-1 · ambition → P4"], ["Rd 12", "Weekly 1-on-1 · grounded → P6"]],
    topic: "Topic this week: his favourite track",
    rounds: [
      { q: "I love this place. The car felt great in sector 2 – I think we can fight Duarte for the podium.", answers: [
        { tone: "Share the ambition", known: true, say: "Then let's go for it. Podium is the target.", reply: "That's what I wanted to hear.", face: "Fired up",
          fx: [["Confidence", "+4", "pos", "race"], ["Overtaking attempts", "+10 %", "neu", "race"]], wear: "Used 2 weeks in a row – effect −30 %" },
        { tone: "Keep him grounded", known: true, say: "Great feeling, but Duarte has the faster car. Take what the race gives.", reply: "Fair. Patience then.", face: "Focused",
          fx: [["Composure", "+4", "pos", "race"], ["Mistake risk", "−6 %", "pos", "race"]] },
        { tone: "Ask about the car", known: true, say: "What exactly feels good in sector 2? Ito should know.", reply: "Rear is planted in the fast stuff. Front could use a click more wing.", face: "Engaged",
          fx: [["Setup", "+1 %", "pos", "race"], ["Chemistry with engineer", "+1", "pos", "lasting"]] },
        { tone: "Rivalry", known: false, say: "Duarte said in the press you're 'a good number two'.", reply: "Did he now. Tomorrow he'll see my gearbox.", face: "Determined",
          fx: [["Aggression", "+15 %", "neu", "race"], ["Contact risk vs. Duarte", "+20 %", "neg", "race"]], hint: "Not known yet – he's calm, but proud" }
      ]}
    ]
  },
  brandt: {
    name: "Jonas Brandt", initials: "JB", role: "24 · No. 2 driver · Race engineer Kowalski", kind: "request",
    chips: [["Qualified P10 (Hale P5)", "bad"], ["Contract ends 2026", "warn"], ["3 races without points", "warn"], ["Hale got the new wing first", "warn"]],
    facts: [["Morale", "38 · Low", "warn"], ["Confidence", "41", "warn"], ["Relationship with you", "Good", "ok"], ["Temperament", "Short-fused", ""]],
    know: [["✓", "good", "Responds well to honesty"], ["✓", "good", "Likes technical answers"], ["?", "warn", "Pressure – not seen yet"], ["?", "warn", "Promises – not seen yet"]],
    history: [["Rd 13", "Weekly 1-on-1 · reassured → P12"], ["Rd 11", "Asked to talk · tyre strategy → calm"], ["Rd 9", "Promise kept: equal strategy"]],
    topic: "He asked for this talk: he feels the team favours Hale",
    stakes: "Morale can move ±10. A bad talk can end in a transfer request; a good one can make him loyal for years.",
    rounds: [
      { q: "Can we talk? Honestly… everything here is built around Marco. He got the new wing first, he gets the better strategy calls. I'm starting to wonder if I have a future here.", answers: [
        { tone: "Admit it, fix it", known: true, say: "You're right about the wing. From Austin on, new parts alternate between the cars.", reply: "…OK. That's more than I expected. Thank you.", face: "Relieved", mood: 30,
          fx: [["Morale", "+6", "pos", "lasting"], ["Promise: parts alternate", "from Austin", "neu", "lasting"]] },
        { tone: "Show the data", known: true, say: "Marco's chassis was ready first, that's all. Look – here's the build schedule.", reply: "Hm. I didn't know the chassis was the reason. Still feels bad, but OK.", face: "Thinking", mood: 15,
          fx: [["Morale", "+2", "pos", "lasting"], ["Confidence", "+3", "pos", "race"]] },
        { tone: "Back him publicly", known: false, say: "I'll tell the press tomorrow that you are a key part of our future.", reply: "You'd say that? In public?", face: "Surprised", mood: 25,
          fx: [["Morale", "+5", "pos", "lasting"], ["Media statement", "public", "neu", "lasting"]], hint: "Not known yet – hurts if you don't extend him later" },
        { tone: "Tough love", known: false, say: "Futures are earned. Beat Marco and the question answers itself.", reply: "So it's my fault. Great. Really great.", face: "Angry", mood: -35,
          fx: [["Morale", "−5", "neg", "lasting"], ["Focus", "+6", "pos", "race"], ["Composure", "−6", "neg", "race"]], hint: "Not known yet – risky, he is short-fused" },
        { tone: "Talk contract", known: true, say: "Let's sit down about an extension after the summer break.", reply: "Seriously? Yes. Yes, let's do that.", face: "Hopeful", mood: 35,
          fx: [["Morale", "+8", "pos", "lasting"], ["Promise: contract talks", "by September", "neu", "lasting"]] },
        { tone: "Not now", known: true, say: "This is not the moment. Focus on the race.", reply: "Right. As always.", face: "Shut down", mood: -50,
          fx: [["Morale", "−8", "neg", "lasting"], ["Relationship with you", "−4", "neg", "lasting"], ["Composure", "−5", "neg", "race"]] }
      ]},
      { q: "And if I outqualify him in Austin? Do I get the strategy priority then?", answers: [
        { tone: "Yes, earn it", known: true, say: "Whoever is ahead after qualifying gets the first call. Same rule for both.", reply: "Fair rules. That's all I want.", face: "Motivated", mood: 25,
          fx: [["Confidence", "+5", "pos", "race"], ["Team rule: priority by quali", "new", "neu", "lasting"]] },
        { tone: "Honest no", known: true, say: "No. Marco leads the championship for us. That won't change this year.", reply: "…At least you're honest.", face: "Disappointed", mood: -15,
          fx: [["Morale", "−3", "neg", "lasting"], ["Accepts team orders", "Yes", "pos", "race"]] },
        { tone: "Dodge", known: false, say: "Let's see how the weekend goes first.", reply: "That's not an answer.", face: "Suspicious", mood: -20,
          fx: [["Trust in your promises", "−5", "neg", "lasting"]], hint: "Not known yet" },
        { tone: "Humour", known: false, say: "Outqualify him first, then I'll buy the dinner too.", reply: "Ha. Deal. I'll pick an expensive place.", face: "Laughing", mood: 15,
          fx: [["Relationship with you", "+2", "pos", "lasting"], ["Confidence", "+2", "pos", "race"]], hint: "Not known yet – depends on his mood right now" }
      ]},
      { q: "Can I trust you on this?", answers: [
        { tone: "Give your word", known: true, say: "You have my word. Look me in the eye.", reply: "OK. I'm in.", face: "Determined", mood: 15,
          fx: [["Promises count double", "kept or broken", "neu", "lasting"], ["Confidence", "+3", "pos", "race"]] },
        { tone: "Results first", known: true, say: "Trust goes both ways. Show me on Sunday.", reply: "Fine. Sunday then.", face: "Focused", mood: 0,
          fx: [["Focus", "+4", "pos", "race"]] },
        { tone: "Bring in the coach", known: true, say: "I'd like you to work with Dr. Weiss on the pressure side this month.", reply: "Maybe that's not a bad idea.", face: "Open", mood: 10,
          fx: [["Composure", "+2", "pos", "lasting"], ["Mental coach workload", "+1 driver", "neu", "lasting"]] }
      ]}
    ]
  }
};

// ---------- State ----------
let current = "brandt";
const picks = { hale: [], brandt: [] };
const START_MOOD = { hale: 40, brandt: -30 };
const fxChip = ([l, v, t]) => `<span class="fxchip ${t}">${l} ${v}</span>`;

function moodPath(d) {
  // Talk mood after each answer, for the small sparkline.
  const vals = [START_MOOD[d]];
  picks[d].forEach((p, k) => vals.push(Math.max(-100, Math.min(100, vals.at(-1) + (TALKS[d].rounds[k].answers[p].mood ?? 0)))));
  return vals;
}
function moodLabel(v) { return v < -50 ? ["Hostile", "bad"] : v < 0 ? ["Tense", "warn"] : v < 50 ? ["Open", "ok"] : ["Positive", "good"]; }
function talkMood(d) {
  const vals = moodPath(d), v = vals.at(-1), [lab, cls] = moodLabel(v);
  const pts = vals.map((x, i) => `${i * 40 + 4},${24 - (x + 100) / 200 * 22}`).join(" ");
  return `<div class="talkmood"><span class="muted">Talk mood</span><div class="bar"><i style="left:calc(${(v + 100) / 2}% - 2px)"></i></div><b class="${cls}">${lab} (${v > 0 ? "+" : ""}${v})</b></div>
    <div class="talkmood"><span class="muted">So far</span><svg class="spark" viewBox="0 0 130 26" preserveAspectRatio="none"><line x1="0" x2="130" y1="13" y2="13" stroke="var(--line-strong)"/><polyline points="${pts}" fill="none" stroke="var(--amber)" stroke-width="2"/></svg><span class="muted" style="font-size:.75rem">End mood scales all effects</span></div>`;
}

// ---------- Rendering ----------
function answerButton(a, i) {
  const pred = a.known ? a.fx.map(fxChip).join("") : `<span class="fxchip neu">? ${a.hint}</span>`;
  return `<button class="answer" data-i="${i}"><span class="tone">${a.tone}<em class="${a.known ? "good" : "warn"}">${a.known ? "Known reaction" : "Not known yet"}</em></span><span class="say">"${a.say}"</span><span class="pred">${pred}${a.wear ? `<span class="fxchip neg">${a.wear}</span>` : ""}</span></button>`;
}
function thread(d) {
  const t = TALKS[d];
  let out = "";
  t.rounds.forEach((r, k) => {
    if (k > picks[d].length) return;
    out += `<div class="bubble driver"><small>${t.name}</small>${r.q}</div>`;
    const p = picks[d][k];
    if (p === undefined) return;
    const a = r.answers[p];
    out += `<div class="bubble me"><small>You · ${a.tone}</small>${a.say}</div>`;
    out += `<div class="bubble driver"><small>${t.name}</small>${a.reply}<div class="fx">${a.fx.map(fxChip).join("")}</div></div>`;
    const m = a.mood !== undefined ? ` · talk mood <b class="${a.mood >= 0 ? "good" : "bad"}">${a.mood > 0 ? "+" : ""}${a.mood}</b>` : "";
    out += `<div class="mood-line">Body language: ${a.face}${m}</div>`;
  });
  return out;
}
function answers(d) {
  const t = TALKS[d], k = picks[d].length;
  if (k >= t.rounds.length) return `<div class="empty">Talk finished. ${t.kind === "request" ? "The end mood decides how strong the lasting effects are." : "Effects apply on Sunday."}</div>`;
  const n = t.rounds[k].answers.length;
  return `<div class="round-label">Your answer · ${k + 1} of ${t.rounds.length}</div><div class="answers ${n % 3 === 0 ? "three" : ""}">${t.rounds[k].answers.map(answerButton).join("")}</div>`;
}
function effects(d) {
  const all = picks[d].flatMap((p, k) => TALKS[d].rounds[k].answers[p].fx);
  if (!all.length) return `<div class="empty">No effects yet. Choose an answer.</div>`;
  return all.map(([l, v, t, s]) => `<div class="fx-row"><span>${l}<span class="scope">${s === "race" ? "This race" : "Lasting"}</span></span><b class="${t === "pos" ? "good" : t === "neg" ? "bad" : "muted"} mono">${v}</b></div>`).join("");
}
function render() {
  const d = current, t = TALKS[d], req = t.kind === "request";
  const done = picks[d].length >= t.rounds.length;
  document.getElementById("stage").innerHTML = `
  <div class="card" style="padding:0"><h3 style="margin:0">Strategy screen · briefing<small>quick tactical choice for both drivers</small></h3><div class="brief">
    ${Object.keys(BRIEF).map(briefBlock).join("")}</div></div>
  <div class="card" style="padding:0"><div class="tabs" role="group" aria-label="1-on-1">
    <button data-tab="hale" aria-pressed="${d === "hale"}">Marco Hale<span class="muted">${picks.hale.length >= 1 ? "✓ done" : "Weekly 1-on-1"}</span></button>
    <button data-tab="brandt" aria-pressed="${d === "brandt"}">Jonas Brandt<span class="warn">⚠ Asked to talk</span></button></div></div>
  <div class="row" style="grid-template-columns:320px 1fr 320px">
    <div class="card"><h3>${req ? "Asked to talk" : "Weekly 1-on-1"}<small>Sun · Monteverde GP</small></h3>
      <div class="who"><div class="face">${t.initials}</div><div><b>${t.name}</b><span class="muted">${t.role}</span></div></div>
      <div class="chips">${t.chips.map(([c, k]) => `<span class="chip ${k}">${c}</span>`).join("")}</div>
      ${t.facts.map(([k, v, c]) => `<div class="fact"><span class="k">${k}</span><span class="v ${c}">${v}</span></div>`).join("")}
      <div class="small-head">What you know about him</div>
      ${t.know.map(([i, c, s]) => `<div class="know"><span class="${c}">${i}</span><span>${s}</span></div>`).join("")}
      <div class="small-head">Recent talks</div>
      ${t.history.map(([r, s]) => `<div class="history"><span>${r}</span><span>${s}</span></div>`).join("")}
    </div>
    <div class="card ${req ? "request" : ""}"><h3>${t.topic}<small>${t.rounds.length} ${t.rounds.length === 1 ? "answer" : "answers"}</small></h3>
      ${req ? `<div class="stakes"><b>At stake</b><span>${t.stakes}</span></div>${talkMood(d)}` : ""}
      <div class="thread">${thread(d)}</div>${answers(d)}
      <div class="actions"><button class="btn small" data-reset>Start again</button><button class="btn delegate-btn">Let mental coach talk</button>${done ? `<button class="btn primary">${d === "brandt" ? "Next: Marco Hale ▷" : "Next: Jonas Brandt ▷"}</button>` : ""}</div></div>
    <div class="card"><h3>Effects<small>exact once known</small></h3>${effects(d)}
      <div class="pad muted" style="font-size:.78rem">"This race" ends after the flag. "Lasting" stays (morale, relationship, promises).</div></div>
  </div>`;
  document.getElementById("note").innerHTML = req
    ? "<b>Driver asked to talk.</b> Rare, triggered by something real (here: Hale got the new wing first). Three rounds, six answers to start, a talk mood that swings up and down, and lasting consequences – promises, team rules, even a transfer request."
    : "<b>Weekly 1-on-1.</b> Every race weekend with every driver. One question about this week's topic (drawn from his situation), four answers, small effects mostly for this race. Repeating the same line wears off.";
  document.querySelectorAll("[data-d]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.d === d)));
  document.querySelectorAll("#stage .answer").forEach(b => b.addEventListener("click", () => { picks[d].push(+b.dataset.i); render(); }));
  document.querySelectorAll("#stage [data-reset]").forEach(b => b.addEventListener("click", () => { picks[d] = []; render(); }));
  document.querySelectorAll("#stage [data-tab]").forEach(b => b.addEventListener("click", () => { current = b.dataset.tab; render(); }));
  document.querySelectorAll("#stage .btn.primary").forEach(b => b.addEventListener("click", () => { current = d === "brandt" ? "hale" : "brandt"; render(); }));
  document.querySelectorAll("#stage [data-brief]").forEach(b => b.addEventListener("click", () => { briefPick[b.dataset.brief] = +b.dataset.i; render(); }));
}

// ---------- Briefing ----------
// Per option: effects in the race; per driver: staff recommendation and why.
const BRIEF_OPTIONS = [
  { name: "Bring it home", fx: [["Mistake risk", "−15 %", "pos"], ["Overtaking attempts", "−30 %", "neu"], ["Tyre wear", "−5 %", "pos"]] },
  { name: "Attack", fx: [["Overtaking attempts", "+30 %", "pos"], ["Pace on the limit", "+0.05 s/lap", "pos"], ["Tyre wear", "+8 %", "neg"], ["Contact risk", "+10 %", "neg"]] },
  { name: "No pressure", fx: [["Composure", "+6", "pos"], ["Mistake risk", "−8 %", "pos"], ["Overtaking attempts", "−10 %", "neu"]] },
  { name: "Team player", fx: [["Accepts team orders", "Yes", "pos"], ["Helps teammate in duels", "Yes", "pos"], ["Morale", "−1 (lasting)", "neg"]] }
];
const BRIEF = {
  hale: { name: "Hale", rec: 1, by: "Race engineer Ito", why: "Starts P5 on a track that suits him, high confidence – he can fight for the podium." },
  brandt: { name: "Brandt", rec: 2, by: "Race engineer Kowalski", why: "Low morale and short-fused. Pressure now makes mistakes more likely, not results." }
};
const briefPick = { hale: 1, brandt: 0 };
function briefBlock(id) {
  const b = BRIEF[id], pick = briefPick[id], opt = BRIEF_OPTIONS[pick];
  const seg = BRIEF_OPTIONS.map((o, i) => `<button data-brief="${id}" data-i="${i}" aria-pressed="${i === pick}">${o.name}${i === b.rec ? " ★" : ""}</button>`).join("");
  const advice = pick === b.rec
    ? `<span class="good">★ Recommended by ${b.by}</span>`
    : `<span class="warn">★ ${b.by} recommends “${BRIEF_OPTIONS[b.rec].name}”</span>`;
  return `<div class="brief-item"><div class="brief-top"><b>${b.name}</b><div class="seg">${seg}</div></div>
    <div class="brief-fx">${opt.fx.map(fxChip).join("")}</div>
    <div class="brief-why">${advice}<span class="muted"> – ${b.why}</span></div></div>`;
}
document.querySelectorAll("[data-d]").forEach(b => b.addEventListener("click", () => { current = b.dataset.d; render(); }));
render();
</script>

<title>Race Weekend Mockups</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: chrome (screen tabs) on top, then the fixed dark Pit Wall stage for
   one step of the race weekend: hub, strategy, key moment, result. */
:root {
  --chrome-bg: #f3f4f6; --chrome-fg: #1b2230; --chrome-muted: #5d6676; --chrome-line: #d6dae1;
  --chrome-btn: #ffffff; --chrome-active: #1b2230; --chrome-active-fg: #ffffff;
  --bg: #0e1216; --panel: #141a20; --panel-2: #10151a; --text: #dfe5ea; --muted: #7f8b96; --faint: #56616c;
  --line: #232c35; --line-strong: #34404b; --zebra: #171e25; --hover: #1d2731; --amber: #f2a93b; --team: #e8471c;
  --lv1: #ef5b5b; --lv2: #e0a13a; --lv3: #8fc46a; --lv4: #4fd1a5; --rain: #5aa9e6; --sc: #f2d43b;
  --soft: #e5484d; --medium: #f2d43b; --hard: #e6e9ee; --inter: #4fd18b; --wet: #4a8fe6;
  --f-display: "Barlow Condensed", "Arial Narrow", sans-serif;
  --f-body: "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --chrome-bg: #0a0c0f; --chrome-fg: #e6e9ee; --chrome-muted: #8f98a8; --chrome-line: #262c36; --chrome-btn: #151920; --chrome-active: #f2a93b; --chrome-active-fg: #101318; color-scheme: dark; }
}
:root[data-theme="dark"] { --chrome-bg: #0a0c0f; --chrome-fg: #e6e9ee; --chrome-muted: #8f98a8; --chrome-line: #262c36; --chrome-btn: #151920; --chrome-active: #f2a93b; --chrome-active-fg: #101318; color-scheme: dark; }
* { box-sizing: border-box; }
body { background: var(--chrome-bg); color: var(--chrome-fg); font-family: var(--f-body); font-size: 14px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 20px 40px; }
.lab { max-width: 1500px; margin: 0 auto; display: grid; gap: 12px; }
.lab-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; }
.lab-head h1 { margin: 0; font-size: 1.25rem; font-weight: 600; }
.lab-head p { margin: 4px 0 0; color: var(--chrome-muted); font-size: .875rem; max-width: 80ch; }
.controls { display: flex; flex-wrap: wrap; gap: 6px; }
.controls button { font: inherit; font-size: .875rem; padding: 8px 14px; border-radius: 4px; cursor: pointer; border: 1px solid var(--chrome-line); background: var(--chrome-btn); color: var(--chrome-fg); }
.controls button[aria-pressed="true"] { background: var(--chrome-active); color: var(--chrome-active-fg); border-color: var(--chrome-active); }
.controls button:focus-visible { outline: 2px solid var(--team); outline-offset: 2px; }
.note { margin: 0; font-size: .875rem; color: var(--chrome-muted); max-width: 120ch; }
.note b { color: var(--chrome-fg); }

.stage { background: var(--bg); color: var(--text); padding: 16px; border-radius: 2px; display: grid; gap: 14px; overflow-x: auto; }
.row { display: grid; gap: 14px; min-width: 0; }
.stack { display: grid; gap: 14px; align-content: start; min-width: 0; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 2px; padding-bottom: 10px; min-width: 0; position: relative; }
.card > h3 { margin: 0 0 4px; padding: 8px 16px 7px; border-bottom: 1px solid var(--line); font-family: var(--f-display); font-weight: 700; font-size: .9rem; letter-spacing: .12em; text-transform: uppercase; color: var(--amber); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.card > h3 small { font-family: var(--f-body); font-weight: 400; font-size: .75rem; letter-spacing: 0; text-transform: none; color: var(--muted); }
.sub { margin: 10px 16px 4px; font-family: var(--f-display); font-size: .75rem; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
.pad { padding: 6px 16px; }
.muted { color: var(--muted); }
.good { color: var(--lv4); } .ok { color: var(--lv3); } .warn { color: var(--lv2); } .bad { color: var(--lv1); } .amber { color: var(--amber); } .rain { color: var(--rain); }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.fact { display: grid; grid-template-columns: 1fr auto; gap: 12px; padding: 5px 16px; align-items: baseline; }
.fact:nth-child(even of .fact) { background: var(--zebra); }
.fact .k { color: var(--muted); }
.fact .v { font-weight: 600; text-align: right; }
.meter { height: 6px; background: var(--line); position: relative; }
.meter i { position: absolute; inset: 0 auto 0 0; }

/* Header with session stepper */
.weekend-head { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; padding: 12px 18px; border-left: 5px solid var(--amber); }
.weekend-head .round { font-family: var(--f-display); font-weight: 600; color: var(--amber); text-transform: uppercase; letter-spacing: .1em; }
.weekend-head .name { font-family: var(--f-display); font-size: 2.2rem; font-weight: 700; text-transform: uppercase; line-height: 1; }
.weekend-head .meta { color: var(--muted); margin-top: 4px; }
.steps { display: flex; align-items: center; gap: 0; }
.step { display: grid; justify-items: center; gap: 4px; min-width: 120px; }
.step .dot { width: 30px; height: 30px; border: 2px solid var(--line-strong); display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; color: var(--muted); }
.step.done .dot { background: var(--lv3); border-color: var(--lv3); color: #0e1216; }
.step.now .dot { border-color: var(--amber); color: var(--amber); box-shadow: 0 0 0 4px color-mix(in srgb, var(--amber) 20%, transparent); }
.step span { font-family: var(--f-display); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; font-size: .8rem; color: var(--muted); }
.step.now span { color: var(--amber); }
.step-line { width: 50px; height: 2px; background: var(--line-strong); margin-bottom: 20px; }

/* Choice tiles */
.choices { display: grid; gap: 8px; padding: 8px 16px; }
.choices.c2 { grid-template-columns: repeat(2, 1fr); } .choices.c3 { grid-template-columns: repeat(3, 1fr); } .choices.c4 { grid-template-columns: repeat(4, 1fr); }
.choice { text-align: left; font: inherit; color: var(--text); background: var(--panel-2); border: 1px solid var(--line-strong); padding: 10px 12px; cursor: pointer; display: grid; gap: 3px; }
.choice b { font-weight: 600; }
.choice small { color: var(--muted); font-size: .78rem; line-height: 1.35; }
.choice[aria-pressed="true"] { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 12%, var(--panel-2)); }
.choice[aria-pressed="true"] b { color: var(--amber); }
.choice:hover { border-color: var(--amber); }
.choice:focus-visible, .btn:focus-visible, .seg button:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.tag { display: inline-block; font-family: var(--f-display); font-weight: 700; font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; padding: 1px 6px; border: 1px solid; margin-left: 6px; vertical-align: 1px; }
.tag.rec { color: var(--lv4); border-color: var(--lv4); }
.tag.risk { color: var(--lv2); border-color: var(--lv2); }
.delegate { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 6px 16px 0; color: var(--muted); font-size: .8rem; }
.btn { font: inherit; padding: 8px 14px; cursor: pointer; border: 1px solid var(--line-strong); background: var(--panel); color: var(--text); }
.btn.small { padding: 5px 10px; font-size: .8rem; }
.btn.primary { background: var(--amber); color: #0e1216; border-color: var(--amber); font-family: var(--f-display); font-weight: 700; font-size: 1.15rem; letter-spacing: .06em; text-transform: uppercase; padding: 10px 24px; }
.btn.delegate-btn { border-color: color-mix(in srgb, var(--lv4) 50%, transparent); color: var(--lv4); }
.actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: flex-end; align-items: center; }

.driver-line { display: grid; grid-template-columns: 150px 1fr; gap: 12px; align-items: center; padding: 6px 16px; }
.driver-line:nth-child(even of .driver-line) { background: var(--zebra); }
.driver-line .who { display: flex; align-items: center; gap: 8px; font-weight: 600; }
.driver-line .who i { width: 4px; height: 24px; background: var(--team); }
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; }
.seg button { font: inherit; font-size: .82rem; padding: 7px 6px; background: var(--panel-2); color: var(--muted); border: 1px solid var(--line-strong); cursor: pointer; }
.seg button + button { border-left: none; }
.seg button[aria-pressed="true"] { background: color-mix(in srgb, var(--amber) 15%, var(--panel-2)); color: var(--amber); border-color: var(--amber); }

/* Weather */
.weather { display: grid; grid-template-columns: repeat(3, 1fr); gap: 0; }
.weather > div { padding: 10px 14px; border-right: 1px solid var(--line); display: grid; gap: 4px; }
.weather > div:last-child { border-right: none; }
.weather small { font-family: var(--f-display); font-weight: 600; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-size: .72rem; }
.weather b { font-size: 1.1rem; }
.char-bar { display: grid; grid-template-columns: 130px 1fr 70px; gap: 10px; align-items: center; padding: 5px 16px; }
.char-bar .meter { height: 8px; }

/* Strategy cards */
.plan { border: 1px solid var(--line-strong); background: var(--panel-2); padding: 12px; display: grid; gap: 8px; cursor: pointer; text-align: left; font: inherit; color: var(--text); }
.plan[aria-pressed="true"] { border-color: var(--amber); background: color-mix(in srgb, var(--amber) 9%, var(--panel-2)); }
.plan h4 { margin: 0; font-family: var(--f-display); font-size: 1.2rem; text-transform: uppercase; letter-spacing: .04em; }
.stint-bar { display: flex; height: 18px; border: 1px solid var(--line-strong); }
.stint-bar span { display: grid; place-items: center; font-family: var(--f-display); font-weight: 700; font-size: .7rem; color: #0e1216; border-right: 2px solid var(--panel-2); }
.plan .facts { display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; font-size: .82rem; }
.plan .facts span:nth-child(odd) { color: var(--muted); }
.quote { border-left: 3px solid var(--amber); padding: 8px 12px; background: var(--panel-2); color: var(--text); font-size: .85rem; margin: 6px 16px; }
.quote small { display: block; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; margin-bottom: 3px; }

/* Live race / key moment */
.live { grid-template-columns: 340px 1fr; align-items: start; }
.tower { font-family: var(--f-mono); font-size: .82rem; }
.tower div { display: grid; grid-template-columns: 26px 6px 1fr auto 26px; gap: 8px; padding: 4px 12px; align-items: center; }
.tower div:nth-child(even) { background: var(--zebra); }
.tower div.mine { background: color-mix(in srgb, var(--team) 14%, transparent); }
.tower i { height: 14px; }
.tyre { width: 18px; height: 18px; border-radius: 50%; border: 3px solid; display: inline-block; }
.race-head { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; gap: 12px; flex-wrap: wrap; }
.race-head .lap { font-family: var(--f-display); font-size: 1.8rem; font-weight: 700; }
.flag { font-family: var(--f-display); font-weight: 700; letter-spacing: .1em; padding: 6px 14px; text-transform: uppercase; }
.flag.sc { background: var(--sc); color: #0e1216; }
.progress { height: 8px; background: var(--line); position: relative; margin: 0 16px; }
.progress i { position: absolute; inset: 0 auto 0 0; background: var(--amber); }
.progress b { position: absolute; top: -3px; bottom: -3px; width: 3px; }
.moment { border: 2px solid var(--sc); background: color-mix(in srgb, var(--sc) 6%, var(--panel)); padding: 16px; display: grid; gap: 12px; margin: 14px 16px; }
.moment h2 { margin: 0; font-family: var(--f-display); font-size: 1.7rem; text-transform: uppercase; }
.moment .data { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.moment .data div { background: var(--panel-2); border: 1px solid var(--line); padding: 8px 10px; }
.moment .data small { display: block; color: var(--muted); font-size: .72rem; text-transform: uppercase; letter-spacing: .08em; }
.moment .data b { font-family: var(--f-mono); font-size: 1.05rem; }
.events { padding: 4px 16px; display: grid; gap: 4px; font-size: .85rem; }
.events span { color: var(--muted); font-family: var(--f-mono); margin-right: 8px; }

/* Result */
.result { grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); align-items: start; }
table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: .84rem; }
th { text-align: left; font-family: var(--f-display); font-weight: 600; letter-spacing: .06em; color: var(--muted); padding: 7px 8px; background: var(--panel-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 5px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
tr.mine td { background: color-mix(in srgb, var(--team) 12%, transparent); }
td .teambar { display: inline-block; width: 4px; height: 14px; vertical-align: -2px; margin-right: 8px; }
.purple { color: #b46bff; font-weight: 600; }
.chart svg { width: 100%; height: auto; display: block; }
.chart text { font-family: var(--f-mono); font-size: 10px; fill: var(--muted); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 4px 16px; font-size: .8rem; color: var(--muted); }
.legend span::before { content: ""; display: inline-block; width: 12px; height: 4px; margin-right: 6px; vertical-align: 3px; background: var(--c); }
.stints { display: grid; gap: 3px; padding: 6px 16px; }
.stints div { display: grid; grid-template-columns: 90px 1fr; gap: 8px; align-items: center; font-size: .78rem; }
.stints .bar { display: flex; height: 12px; }
.stints .bar span { border-right: 1px solid var(--panel); }
.summary { display: grid; grid-template-columns: repeat(4, 1fr); }
.summary > div { padding: 10px 14px; border-right: 1px solid var(--line); display: grid; gap: 2px; }
.summary > div:last-child { border-right: none; }
.summary small { font-family: var(--f-display); font-weight: 600; font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.summary b { font-family: var(--f-display); font-size: 1.6rem; }
.summary span { color: var(--muted); font-size: .78rem; }

@media (max-width: 1100px) { .stage .row { grid-template-columns: 1fr !important; } .choices.c3, .choices.c4 { grid-template-columns: 1fr 1fr; } }
</style>

<div class="lab">
  <div class="lab-head">
    <div>
      <h1>R2 mockups, part 1: the race weekend</h1>
      <p>Sample data (fictional). Choices react when clicked. Every decision has a button to let the responsible staff member decide.</p>
    </div>
    <div class="controls" role="group" aria-label="Step">
      <button data-s="hub" aria-pressed="true">1 · Weekend hub</button>
      <button data-s="strategy" aria-pressed="false">2 · Strategy &amp; briefing</button>
      <button data-s="moment" aria-pressed="false">3 · Key moment</button>
      <button data-s="result" aria-pressed="false">4 · Race result</button>
    </div>
  </div>
  <p class="note" id="note"></p>
  <section class="stage" id="stage"></section>
</div>

<script>
// ---------- Sample data ----------
function rng(seed) { let a = seed >>> 0; return () => { a = (a + 0x6D2B79F5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
const TEAMS = { VRT: "#e8471c", AUR: "#ffd23f", SCA: "#dc143c", MER: "#1fb5a8", NRD: "#1e90ff", BWM: "#4a6cf7", KES: "#32cd32", SOL: "#9370db", HAL: "#ff69b4", IRB: "#c0c0c0", TUN: "#9fd3f0" };
const DRIVERS = [["Duarte", "AUR"], ["Ferraro", "SCA"], ["Morita", "AUR"], ["Alstad", "MER"], ["Lemaire", "SCA"], ["Hale", "VRT"], ["Achterberg", "MER"], ["Okafor", "NRD"], ["Brandt", "VRT"], ["Reyes", "BWM"], ["Lindqvist", "NRD"], ["Ferrand", "KES"], ["Kessler", "BWM"], ["Price", "SOL"], ["Vidal", "KES"], ["Menon", "HAL"], ["Calder", "IRB"], ["Saari", "SOL"], ["de Wit", "IRB"], ["Arrieta", "HAL"], ["Koskinen", "TUN"], ["Whitlock", "TUN"]];
const LAPS = 52, SC = [24, 27], RAIN = [31, 38];
const COLORS = { S: "var(--soft)", M: "var(--medium)", H: "var(--hard)", I: "var(--inter)", W: "var(--wet)" };
const R = rng(14);
// Race model for the mockup: stints, pit stops and lap times per driver.
const race = DRIVERS.map(([name, team], i) => {
  const firstStop = SC[0] + (R() < .6 ? 0 : -Math.floor(R() * 8));
  const interLap = RAIN[0] + (R() < .5 ? 0 : 1);
  const stints = [[R() < .5 ? "M" : "S", 1, firstStop], ["H", firstStop + 1, interLap - 1], ["I", interLap, RAIN[1]], ["M", RAIN[1] + 1, LAPS]];
  const stops = stints.slice(1).map(s => ({ lap: s[1] - 1, stand: +(2.0 + R() * 1.4 + (R() < .06 ? 3 : 0)).toFixed(2), from: "", to: s[0] }));
  stops.forEach((s, k) => { s.from = stints[k][0]; s.lane = +(s.lap >= SC[0] && s.lap <= SC[1] ? 11.5 + s.stand : 20.4 + s.stand).toFixed(1); });
  const base = 88.2 + i * 0.12 + R() * .3;
  const laps = [];
  for (let l = 1; l <= LAPS; l++) {
    const stint = stints.find(s => l >= s[1] && l <= s[2]);
    let t = base + (l - stint[1]) * (stint[0] === "S" ? .07 : stint[0] === "M" ? .045 : .03) + (R() - .5) * .35 + (stint[0] === "S" ? -.6 : stint[0] === "H" ? .3 : 0);
    if (l >= SC[0] && l <= SC[1]) t = 121 + R() * 2;
    if (l >= RAIN[0] && l <= RAIN[1]) t += (stint[0] === "I" ? 6.2 : 14) + (name === "Hale" ? -1.4 : name === "Lemaire" ? -1.1 : 0);
    const stop = stops.find(s => s.lap === l);
    if (stop) t += stop.lane;
    laps.push(+t.toFixed(3));
  }
  return { name, team, stints, stops, laps, grid: [2, 4, 1, 6, 3, 5, 9, 7, 10, 8, 12, 11, 13, 14, 16, 15, 18, 17, 19, 20, 21, 22][i] };
});
race.forEach(r => r.total = r.laps.reduce((a, b) => a + b, 0) + (r.name === "Hale" ? -9.5 : 0));
race.sort((a, b) => a.total - b.total);
const fastest = Math.min(...race.map(r => Math.min(...r.laps)));
const POINTS = [25, 18, 15, 12, 10, 8, 6, 4, 2, 1];
const fmt = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(3).padStart(6, "0")}`;
const lapFmt = s => `${Math.floor(s / 60)}:${(s % 60).toFixed(3).padStart(6, "0")}`;

// ---------- Shared pieces ----------
const card = (title, body, small = "") => `<div class="card"><h3>${title}${small ? `<small>${small}</small>` : ""}</h3>${body}</div>`;
const delegate = (who) => `<div class="delegate"><span>Not sure? Your ${who} will decide, as well as their skill allows.</span><button class="btn small delegate-btn">Let ${who} decide</button></div>`;
function choices(group, opts, cols, selected = 0) {
  return `<div class="choices c${cols}">${opts.map((o, i) => `<button class="choice" data-group="${group}" aria-pressed="${i === selected}"><b>${o[0]}${o[2] ? `<span class="tag ${o[2]}">${o[2] === "rec" ? "Recommended" : "Risky"}</span>` : ""}</b><small>${o[1]}</small></button>`).join("")}</div>`;
}
const header = (stepIndex) => `<div class="card weekend-head"><div><div class="round">Round 14 of 24 · Mexico</div><div class="name">Monteverde Grand Prix</div><div class="meta">Fri 31 Jul – Sun 2 Aug 2026 · 4.31 km · 52 laps</div></div>
  <div class="steps">${["Practice", "Qualifying", "Race"].map((s, i) => `${i ? '<div class="step-line"></div>' : ""}<div class="step ${i < stepIndex ? "done" : i === stepIndex ? "now" : ""}"><div class="dot">${i < stepIndex ? "✓" : i + 1}</div><span>${s}</span></div>`).join("")}</div></div>`;

// ---------- 1. Weekend hub ----------
function hub() {
  return `${header(0)}
  <div class="row" style="grid-template-columns:1fr 1fr 1fr">
    ${card("Track character", `
      <div class="char-bar"><span class="muted">Downforce</span><div class="meter"><i style="width:85%;background:var(--amber)"></i></div><span>Very high</span></div>
      <div class="char-bar"><span class="muted">Engine power</span><div class="meter"><i style="width:40%;background:var(--amber)"></i></div><span>Medium</span></div>
      <div class="char-bar"><span class="muted">Overtaking</span><div class="meter"><i style="width:25%;background:var(--lv2)"></i></div><span>Hard</span></div>
      <div class="char-bar"><span class="muted">Tyre wear</span><div class="meter"><i style="width:75%;background:var(--lv1)"></i></div><span>High</span></div>
      <div class="fact"><span class="k">Time lost in the pit lane</span><span class="v mono">20.4 s</span></div>
      <div class="fact"><span class="k">Your car here</span><span class="v ok">Strong (downforce)</span></div>`, "what this track rewards")}
    ${card("Weather forecast", `<div class="weather">
      <div><small>Friday</small><b>☀ Dry</b><span class="muted">Rain 5 %</span></div>
      <div><small>Saturday</small><b>⛅ Cloudy</b><span class="muted">Rain 20 %</span></div>
      <div><small>Sunday</small><b class="rain">🌧 Showers</b><span class="rain">Rain 45 %</span></div></div>
      <div class="quote"><small>Daiki Matsuda · strategy chief</small>"Models disagree for Sunday. I'd say ±10 %. Rain most likely in the second half."</div>`, "accuracy depends on your strategy chief")}
    ${card("Weekend target", choices("target", [
      ["Both cars in the points", "Balanced risk. Morale bonus if achieved."],
      ["Attack the podium", "More aggressive strategy and driving. Bigger reward, more mistakes."],
      ["Bring both cars home", "Safe and steady. Few risks, little upside."]], 1, 0) + delegate("sporting director"), "sets the risk level")}
  </div>
  <div class="row" style="grid-template-columns:1.4fr 1fr">
    ${card("Practice programme", `
      <div class="driver-line"><div class="who"><i></i>Marco Hale</div><div class="seg"><button aria-pressed="true">Setup work</button><button aria-pressed="false">Long runs &amp; tyres</button><button aria-pressed="false">Academy driver in FP1</button></div></div>
      <div class="driver-line"><div class="who"><i></i>Jonas Brandt</div><div class="seg"><button aria-pressed="false">Setup work</button><button aria-pressed="true">Long runs &amp; tyres</button><button aria-pressed="false">Academy driver in FP1</button></div></div>
      <div class="pad muted" style="font-size:.8rem">Setup work: better setup (race engineer, feedback, chemistry). Long runs: better tyre data for the strategy. Academy driver: experience for your talent, less setup time for the race driver.</div>
      ${delegate("race engineers")}`, "per driver")}
    ${card("Team orders policy", choices("orders", [
      ["Free racing", "Drivers may fight. Morale stays high, risk of losing points."],
      ["Hold positions after the last stop", "Protects points. Small morale hit for the faster driver."],
      ["Priority: Hale", "Brandt helps Hale (No.1 status). Brandt's morale drops."]], 1, 1) + delegate("sporting director"))}
  </div>
  <div class="actions"><button class="btn delegate-btn">Let staff decide everything</button><button class="btn primary">Start practice ▷</button></div>`;
}

// ---------- 2. Strategy & briefing ----------
function stintBar(stints, laps = LAPS) {
  return `<div class="stint-bar">${stints.map(([c, n]) => `<span style="width:${n / laps * 100}%;background:${COLORS[c]}">${c}${n}</span>`).join("")}</div>`;
}
function strategy() {
  return `${header(2)}
  <div class="row" style="grid-template-columns:1fr 2fr">
    ${card("Practice & qualifying", `
      <div class="fact"><span class="k">Setup Hale</span><span class="v good">92 % · excellent</span></div>
      <div class="fact"><span class="k">Setup Brandt</span><span class="v ok">78 % · good</span></div>
      <div class="fact"><span class="k">Tyre data</span><span class="v ok">Good (long runs Brandt)</span></div>
      <div class="fact"><span class="k">Grid</span><span class="v">Hale P5 · Brandt P10</span></div>
      <div class="fact"><span class="k">Rain on Sunday</span><span class="v rain">45 % · from lap ~30</span></div>`)}
    ${card("Race strategy", `<div class="choices c3" style="grid-template-columns:repeat(3,1fr)">
      <button class="plan" data-group="plan" aria-pressed="true"><h4>A · One stop <span class="tag rec">Recommended</span></h4>${stintBar([["M", 24], ["H", 28]])}
        <div class="facts"><span>Expected finish</span><span>P4–P6</span><span>Risk</span><span class="ok">Low</span><span>If it rains</span><span>Flexible: stop moves to the rain</span></div></button>
      <button class="plan" data-group="plan" aria-pressed="false"><h4>B · Two stops <span class="tag risk">Risky</span></h4>${stintBar([["S", 14], ["M", 18], ["S", 20]])}
        <div class="facts"><span>Expected finish</span><span>P3–P8</span><span>Risk</span><span class="warn">High (overtaking hard)</span><span>If it rains</span><span>Loses a stop</span></div></button>
      <button class="plan" data-group="plan" aria-pressed="false"><h4>C · Split strategies</h4>${stintBar([["M", 24], ["H", 28]])}${stintBar([["S", 14], ["M", 18], ["S", 20]])}
        <div class="facts"><span>Expected finish</span><span>One car P3–P5</span><span>Risk</span><span class="warn">Medium</span><span>Idea</span><span>Hale safe, Brandt gambles</span></div></button></div>
      <div class="quote"><small>Daiki Matsuda · strategy chief</small>"Overtaking is hard here, track position is king. Plan A keeps us flexible for the rain."</div>
      ${delegate("strategy chief")}`, "proposals by your strategy chief")}
  </div>
  <div class="row" style="grid-template-columns:1fr 1.4fr">
    ${card("Rain gamble · setup direction", choices("rain", [
      ["Dry setup", "Fastest if it stays dry. Big loss in the wet.", ""],
      ["Compromise", "A little slower in both conditions.", "rec"],
      ["Wet setup", "Strong if it rains (45 %). Slow if it stays dry.", "risk"]], 3, 1) + delegate("race engineers"), "only when rain is possible")}
    ${card("Driver briefing", `
      <div class="driver-line"><div class="who"><i></i>Marco Hale</div><div class="seg"><button aria-pressed="false">Bring it home</button><button aria-pressed="true">Attack!</button><button aria-pressed="false">No pressure</button></div></div>
      <div class="pad" style="font-size:.8rem"><span class="good">Hot-headed + ambitious:</span> <span class="muted">"Attack!" gives confidence +6, but collision risk +15 %.</span></div>
      <div class="driver-line"><div class="who"><i></i>Jonas Brandt</div><div class="seg"><button aria-pressed="false">Bring it home</button><button aria-pressed="false">Attack!</button><button aria-pressed="true">No pressure</button></div></div>
      <div class="pad" style="font-size:.8rem"><span class="warn">Low morale:</span> <span class="muted">"No pressure" calms him (mistakes −20 %). "Attack!" could backfire.</span></div>
      ${delegate("mental coach")}`, "effect depends on personality")}
  </div>
  <div class="actions"><button class="btn delegate-btn">Let staff decide everything</button><button class="btn primary">Start race ▷</button></div>`;
}

// ---------- 3. Key moment ----------
function moment() {
  const top = race.slice(0, 12);
  return `${header(2)}
  <div class="row live">
    ${card("Running order · lap 24", `<div class="tower">${top.map((r, i) => `<div class="${r.team === "VRT" ? "mine" : ""}"><span>${i + 1}</span><i style="background:${TEAMS[r.team]}"></i><span>${r.name}</span><span class="muted">${i === 0 ? "Leader" : "+" + (i * 1.3 + R()).toFixed(1)}</span><span class="tyre" style="border-color:${COLORS[i % 3 ? "M" : "S"]}"></span></div>`).join("")}</div>`, "your cars highlighted")}
    <div class="card">
      <div class="race-head"><span class="lap">Lap 24 / 52</span><span class="flag sc">Safety car</span><span class="muted">Simulation paused for your decision</span></div>
      <div class="progress"><i style="width:${24 / LAPS * 100}%"></i><b style="left:${SC[0] / LAPS * 100}%;background:var(--sc)"></b><b style="left:${RAIN[0] / LAPS * 100}%;background:var(--rain)"></b></div>
      <div class="moment">
        <h2>Safety car – crash at turn 4 (Arrieta)</h2>
        <div class="muted">A stop under the safety car costs only about 11.5 s instead of 20.4 s. Rain is expected in about 7 laps.</div>
        <div class="data"><div><small>Hale · P5</small><b>Medium · 23 laps</b></div><div><small>Brandt · P9</small><b>Soft · 23 laps</b></div><div><small>Pit loss now</small><b class="good">11.5 s</b></div><div><small>Rain in</small><b class="rain">~7 laps · 60 %</b></div></div>
        ${choices("sc", [
          ["Box both now", "Cheap stop for both cars. Brandt may lose places in the double stop queue (+3 s).", "rec"],
          ["Box Hale only", "Hale keeps track position, Brandt stays out and gambles on the rain."],
          ["Stay out with both", "Wait for the rain and change straight to intermediates.", "risk"]], 3, 0)}
        <div class="quote" style="margin:0"><small>Daiki Matsuda · strategy chief</small>"Box both. Hard tyres now, then inters when it rains – we lose almost nothing."</div>
        <div class="actions"><button class="btn delegate-btn">Let the strategy chief decide</button><button class="btn primary">Confirm ▷</button></div>
      </div>
      <div class="sub">Race events</div>
      <div class="events"><div><span>L1</span>Hale gains one place at the start (P5)</div><div><span>L12</span>Brandt passes Reyes for P9</div><div><span>L23</span>Arrieta crashes at turn 4 – safety car</div></div>
    </div>
  </div>`;
}

// ---------- 4. Result ----------
function lapChart() {
  const w = 760, h = 260, padL = 40, padB = 22, padT = 10;
  const shown = [race[0], race.find(r => r.name === "Hale"), race.find(r => r.name === "Brandt")];
  const colors = ["#ffd23f", "#e8471c", "#ff9a7a"];
  const lo = 86, hi = 112;
  const x = l => padL + (l - 1) / (LAPS - 1) * (w - padL - 10);
  const y = t => padT + (1 - (Math.min(t, hi) - lo) / (hi - lo)) * (h - padT - padB);
  let out = `<rect x="${x(SC[0])}" y="${padT}" width="${x(SC[1]) - x(SC[0])}" height="${h - padT - padB}" fill="var(--sc)" opacity=".12"/>`;
  out += `<rect x="${x(RAIN[0])}" y="${padT}" width="${x(RAIN[1]) - x(RAIN[0])}" height="${h - padT - padB}" fill="var(--rain)" opacity=".12"/>`;
  out += `<text x="${x(SC[0]) + 3}" y="${padT + 12}" style="fill:var(--sc)">SC</text><text x="${x(RAIN[0]) + 3}" y="${padT + 12}" style="fill:var(--rain)">RAIN</text>`;
  for (let t = 88; t <= 110; t += 4) out += `<line x1="${padL}" x2="${w - 10}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="4" y="${y(t) + 3}">1:${String(t - 60).padStart(2, "0")}</text>`;
  for (let l = 1; l <= LAPS; l += 5) out += `<text x="${x(l) - 4}" y="${h - 6}">${l}</text>`;
  shown.forEach((r, k) => {
    const pts = r.laps.map((t, i) => `${x(i + 1).toFixed(1)},${y(t).toFixed(1)}`).join(" ");
    out += `<polyline points="${pts}" fill="none" stroke="${colors[k]}" stroke-width="${k === 1 ? 2.2 : 1.5}" ${k === 2 ? 'stroke-dasharray="4 3"' : ""}/>`;
    r.stops.forEach(s => out += `<circle cx="${x(s.lap)}" cy="${y(hi) + 4}" r="3.5" fill="${colors[k]}"/>`);
  });
  return `<div class="chart pad"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="Lap times of the winner, Hale and Brandt">${out}</svg></div>
    <div class="legend"><span style="--c:#ffd23f">${race[0].name} (winner)</span><span style="--c:#e8471c">Hale</span><span style="--c:#ff9a7a">Brandt</span><span style="--c:var(--sc)">Safety car</span><span style="--c:var(--rain)">Rain</span><span>● = pit stop (lap times above 1:52 cut off)</span></div>`;
}
function result() {
  const hale = race.findIndex(r => r.name === "Hale"), brandt = race.findIndex(r => r.name === "Brandt");
  const winner = race[0];
  const table = `<div style="overflow-x:auto"><table><thead><tr><th>Pos</th><th>Driver</th><th>Grid</th><th>+/−</th><th>Gap</th><th>Best lap</th><th>Stops</th><th>Pts</th></tr></thead><tbody>${race.map((r, i) => {
    const best = Math.min(...r.laps), delta = r.grid - (i + 1);
    return `<tr class="${r.team === "VRT" ? "mine" : ""}"><td>${i + 1}</td><td><span class="teambar" style="background:${TEAMS[r.team]}"></span>${r.name} <span class="muted">${r.team}</span></td><td>${r.grid}</td><td class="${delta > 0 ? "good" : delta < 0 ? "bad" : "muted"}">${delta > 0 ? "▲" + delta : delta < 0 ? "▼" + -delta : "–"}</td><td class="mono">${i === 0 ? fmt(r.total) : "+" + (r.total - winner.total).toFixed(3)}</td><td class="mono ${best === fastest ? "purple" : ""}">${lapFmt(best)}</td><td>${r.stops.length}</td><td>${POINTS[i] ?? ""}</td></tr>`;
  }).join("")}</tbody></table></div>`;
  const stops = race.filter(r => r.team === "VRT").flatMap(r => r.stops.map(s => ({ ...s, name: r.name })));
  const best = race.flatMap(r => r.stops).reduce((a, s) => Math.min(a, s.stand), 99);
  const stopTable = `<table><thead><tr><th>Driver</th><th>Lap</th><th>Tyres</th><th>Standstill</th><th>Pit lane total</th><th></th></tr></thead><tbody>${stops.map(s => `<tr><td>${s.name}</td><td>${s.lap}</td><td><span style="color:${COLORS[s.from]}">${s.from}</span> → <span style="color:${COLORS[s.to]}">${s.to}</span></td><td class="mono ${s.stand > 4 ? "bad" : s.stand < 2.4 ? "good" : ""}">${s.stand.toFixed(2)} s</td><td class="mono">${s.lane.toFixed(1)} s</td><td class="muted">${s.stand > 4 ? "slow wheel nut" : s.lap >= SC[0] && s.lap <= SC[1] ? "under safety car" : ""}</td></tr>`).join("")}</tbody></table>
    <div class="pad muted" style="font-size:.8rem">Fastest stop of the race: <span class="good mono">${best.toFixed(2)} s</span> · your crew average: <span class="mono">${(stops.reduce((a, s) => a + s.stand, 0) / stops.length).toFixed(2)} s</span> (pit crew chief Juho Lehtonen)</div>`;
  const stints = `<div class="stints">${race.slice(0, 22).map(r => `<div><span class="${r.team === "VRT" ? "amber" : "muted"}">${r.name}</span><div class="bar">${r.stints.map(([c, a, b]) => `<span style="width:${(b - a + 1) / LAPS * 100}%;background:${COLORS[c]}"></span>`).join("")}</div></div>`).join("")}</div>
    <div class="legend"><span style="--c:var(--soft)">Soft</span><span style="--c:var(--medium)">Medium</span><span style="--c:var(--hard)">Hard</span><span style="--c:var(--inter)">Intermediate</span><span style="--c:var(--wet)">Wet</span></div>`;
  return `${header(3)}
  <div class="card" style="padding:0"><div class="summary">
    <div><small>Hale</small><b class="good">P${hale + 1}</b><span>from P5 · ${POINTS[hale] ?? 0} pts · best lap in the rain</span></div>
    <div><small>Brandt</small><b>P${brandt + 1}</b><span>from P10 · ${POINTS[brandt] ?? 0} pts</span></div>
    <div><small>Weekend target</small><b class="good">Achieved</b><span>Both cars in the points · morale +4</span></div>
    <div><small>Constructors</small><b>P4</b><span>+${(POINTS[hale] ?? 0) + (POINTS[brandt] ?? 0)} pts · gap to P3: 18 pts</span></div></div></div>
  <div class="row result">
    ${card("Classification", table, `Winner ${winner.name} · ${LAPS} laps · fastest lap ${lapFmt(fastest)}`)}
    <div class="stack">
      ${card("Lap times", lapChart(), "winner vs. your drivers")}
      ${card("Pit stops · your team", stopTable)}
      ${card("Tyre strategies", stints, "all drivers, in finishing order")}
    </div>
  </div>`;
}

// ---------- Page ----------
const NOTES = {
  hub: "<b>Weekend hub.</b> Before practice: track character, weather forecast, weekend target, practice programme per driver and the team orders policy. Every block can be left to the responsible staff member.",
  strategy: "<b>Strategy & briefing.</b> After qualifying: the strategy chief proposes plans with expected result and risk, the rain gamble decides the setup direction, and the briefing sets each driver's mindset depending on personality.",
  moment: "<b>Key moment.</b> The quick simulation pauses only for 2–4 big decisions (safety car, rain, team orders), with the data and the strategist's advice. 'Let the strategy chief decide' always works.",
  result: "<b>Race result.</b> Summary first (your drivers, target, championship), then the full classification, lap time chart with safety car and rain phases, every pit stop with standstill time, and all tyre strategies."
};
const RENDER = { hub, strategy, moment, result };
function show(s) {
  document.getElementById("stage").innerHTML = RENDER[s]();
  document.getElementById("note").innerHTML = NOTES[s];
  document.querySelectorAll("[data-s]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.s === s)));
  // Single choice per group / per segmented row.
  document.querySelectorAll("#stage [data-group]").forEach(b => b.addEventListener("click", () => {
    document.querySelectorAll(`#stage [data-group="${b.dataset.group}"]`).forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  }));
  document.querySelectorAll("#stage .seg").forEach(seg => seg.querySelectorAll("button").forEach(b => b.addEventListener("click", () => {
    seg.querySelectorAll("button").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
  })));
}
document.querySelectorAll("[data-s]").forEach(b => b.addEventListener("click", () => show(b.dataset.s)));
show("hub");
</script>
